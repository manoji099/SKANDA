<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Skanda Engineering</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #0B1F3A;
            --primary-orange: #FF6B00;
            --primary-light: #F5F7FA;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-dark) 0%, #0f2850 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            max-width: 900px;
            width: 90%;
        }

        .login-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .login-branding {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #0f2850 100%);
            color: white;
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .login-branding h1 {
            font-size: 2.5rem;
            color: var(--primary-orange);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .login-branding p {
            font-size: 0.95rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        .login-branding .logo-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: var(--primary-orange);
        }

        .login-form-section {
            padding: 3rem 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-form-section h2 {
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
            font-size: 1.75rem;
            font-weight: 700;
        }

        .login-form-section .subtitle {
            color: #6B7280;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--primary-dark);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #D1D5DB;
            border-radius: 0.35rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.1);
        }

        .btn-login {
            background-color: var(--primary-orange);
            color: white;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 0.35rem;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            cursor: pointer;
            width: 100%;
        }

        .btn-login:hover {
            background-color: #e55a00;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 0, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .form-footer a {
            color: var(--primary-orange);
            text-decoration: none;
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .toggle-form {
            display: inline-block;
            margin-left: 0.5rem;
            cursor: pointer;
            color: var(--primary-orange);
            font-weight: 600;
        }

        .alert {
            padding: 0.75rem 1rem;
            border-radius: 0.35rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .alert-danger {
            background-color: #FEE2E2;
            color: #991B1B;
            border-left: 4px solid #EF4444;
        }

        .alert-success {
            background-color: #ECFDF5;
            color: #166534;
            border-left: 4px solid #10B981;
        }

        .loading-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .login-wrapper {
                grid-template-columns: 1fr;
            }

            .login-branding {
                padding: 2rem;
            }

            .login-form-section {
                padding: 2rem;
            }

            .login-branding h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-wrapper">
            <!-- Branding Section -->
            <div class="login-branding">
                <div class="logo-icon">⚙️</div>
                <h1>Skanda</h1>
                <p>Admin Dashboard</p>
                <p style="margin-top: 1rem; font-size: 0.85rem; opacity: 0.7;">
                    Professional Manufacturing Management System<br>
                    CNC • VMC • Fabrication • Laser Cutting
                </p>
            </div>

            <!-- Login Form Section -->
            <div class="login-form-section">
                <!-- Login Form -->
                <div id="loginForm">
                    <h2>Welcome Back</h2>
                    <p class="subtitle">Sign in to your admin account</p>

                    <div id="loginAlert"></div>

                    <form onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label for="loginEmail">Email Address</label>
                            <input type="email" id="loginEmail" placeholder="admin@skanda.com" required>
                        </div>

                        <div class="form-group">
                            <label for="loginPassword">Password</label>
                            <input type="password" id="loginPassword" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn-login" id="loginBtn">
                            <span id="loginBtnText">Sign In</span>
                        </button>
                    </form>

                    <div class="form-footer">
                        Don't have an account? <span class="toggle-form" onclick="toggleForms()">Create one</span>
                    </div>
                </div>

                <!-- Signup Form -->
                <div id="signupForm" class="hidden">
                    <h2>Create Admin Account</h2>
                    <p class="subtitle">Register your admin credentials</p>

                    <div id="signupAlert"></div>

                    <form onsubmit="handleSignup(event)">
                        <div class="form-group">
                            <label for="signupName">Full Name</label>
                            <input type="text" id="signupName" placeholder="Admin Name" required>
                        </div>

                        <div class="form-group">
                            <label for="signupEmail">Email Address</label>
                            <input type="email" id="signupEmail" placeholder="admin@skanda.com" required>
                        </div>

                        <div class="form-group">
                            <label for="signupPassword">Password</label>
                            <input type="password" id="signupPassword" placeholder="••••••••" required minlength="6">
                        </div>

                        <div class="form-group">
                            <label for="signupConfirm">Confirm Password</label>
                            <input type="password" id="signupConfirm" placeholder="••••••••" required minlength="6">
                        </div>

                        <button type="submit" class="btn-login" id="signupBtn">
                            <span id="signupBtnText">Create Account</span>
                        </button>
                    </form>

                    <div class="form-footer">
                        Already have an account? <span class="toggle-form" onclick="toggleForms()">Sign in</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>

    <!-- Firebase Config -->
    <script src="../backend/js/firebase-config.js"></script>
    <script src="../backend/js/firebase-auth.js"></script>

    <script>
        // Toggle between login and signup forms
        function toggleForms() {
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('signupForm').classList.toggle('hidden');
        }

        // Handle Login
        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            const alertDiv = document.getElementById('loginAlert');

            loginBtn.disabled = true;
            loginBtnText.innerHTML = '<span class="loading-spinner"></span>Signing in...';

            const result = await firebaseAuth.login(email, password);

            if (result.success) {
                // Show success message
                alertDiv.innerHTML = '<div class="alert alert-success">✓ Login successful! Redirecting...</div>';
                
                // Redirect to admin dashboard after 1.5 seconds
                setTimeout(() => {
                    window.location.href = './index.html';
                }, 1500);
            } else {
                // Show error
                alertDiv.innerHTML = `<div class="alert alert-danger">✗ ${result.error}</div>`;
                loginBtn.disabled = false;
                loginBtnText.textContent = 'Sign In';
            }
        }

        // Handle Signup
        async function handleSignup(event) {
            event.preventDefault();

            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;
            const signupBtn = document.getElementById('signupBtn');
            const signupBtnText = document.getElementById('signupBtnText');
            const alertDiv = document.getElementById('signupAlert');

            // Validate passwords match
            if (password !== confirm) {
                alertDiv.innerHTML = '<div class="alert alert-danger">✗ Passwords do not match</div>';
                return;
            }

            signupBtn.disabled = true;
            signupBtnText.innerHTML = '<span class="loading-spinner"></span>Creating account...';

            const result = await firebaseAuth.signup(email, password, name);

            if (result.success) {
                // Show success message
                alertDiv.innerHTML = '<div class="alert alert-success">✓ Account created! Redirecting...</div>';
                
                // Redirect to admin dashboard after 1.5 seconds
                setTimeout(() => {
                    window.location.href = './index.html';
                }, 1500);
            } else {
                // Show error
                alertDiv.innerHTML = `<div class="alert alert-danger">✗ ${result.error}</div>`;
                signupBtn.disabled = false;
                signupBtnText.textContent = 'Create Account';
            }
        }

        // Check if already logged in
        firebaseAuth.onAuthStateChanged((user) => {
            if (user) {
                // User is logged in, redirect to dashboard
                window.location.href = './index.html';
            }
        });

        // Set today's date for reference
        const today = new Date().toLocaleDateString();
        console.log('Skanda Engineering Admin - Initialized on:', today);
    </script>
</body>
</html>
